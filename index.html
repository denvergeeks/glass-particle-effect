<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Glass particle effect</title>
<style>*{box-sizing:border-box}body{margin:0;background:#08090d;color:#eee;font:16px system-ui}main{max-width:1200px;margin:auto;padding:40px 20px}h1{font-size:clamp(28px,5vw,48px)}p{color:#aaa}#effect{height:clamp(320px,55vw,600px);overflow:hidden;border:1px solid #282a35;border-radius:16px}canvas{display:block;width:100%;height:100%}#status{font-size:13px}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/"}}</script></head>
<body><main><h1>Glass particle effect</h1><p>Clean particles pass through. Harmful particles dissolve. Adjust the controls to customize.</p><div id="effect" role="img" aria-label="Animated glass shield filtering particles"></div><p id="status">Loading dependencies…</p></main><script type="module">import {createGlassEffect} from './effect.js';try{const effect=await createGlassEffect(document.querySelector('#effect'));window.glassEffect=effect;document.querySelector('#status').textContent='Ready. Export settings from the control panel.';}catch(e){console.error(e);document.querySelector('#status').textContent='Unable to start: '+e.message;}</script></body></html>
